[project]
name = "medgent"
version = "0.1.0"
description = "Agentic AI for clinical discharge-summary drafting (Dscribe take-home)."
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13",
    "pdfplumber>=0.10",
    "pypdf>=4",
    "fpdf2>=2.7",
    "python-levenshtein>=0.25",
    "pillow>=10",
    "python-dotenv>=1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
medgent = "medgent.run:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
